# 기본 설정. 실험별 차이는 configs/exp/*.yaml 에서 덮어쓴다.
# 명령줄에서도 --set nn.lr=5e-4 처럼 덮어쓸 수 있다.

paths:
  anno_dir: data/aist_plusplus_final      # AIST++ annotations 폴더 (keypoints3d/, ignore_list.txt 포함)
  cache: data/cache/aist_30fps.pkl        # 01_build_cache.py 결과
  splits_dir: data/splits                 # 02_make_splits.py 결과
  results_dir: results

data:
  keypoints_key: keypoints3d   # 또는 keypoints3d_optim
  src_fps: 60
  fps: 30
  up_axis: 1                   # 수직축 (0=x, 1=y, 2=z). 00_inspect_data.py 출력으로 확인할 것
  up_sign: 1                   # 그 축에서 위쪽이 음수 방향이면 -1
  window_sec: 4.0
  stride_sec: 1.0
  drop_joint_groups: []        # 신체 부위 제거 실험: [head] / [arms] / [legs]

split:
  n_repeats: 10                # 장르마다 테스트 댄서 1명을 무작위로 뽑는 반복 횟수
  val_frac: 0.15               # 학습 시퀀스 중 검증용 비율 (장르별 층화)
  seed: 0

xgb:
  max_depth_grid: [3, 5, 7]
  n_estimators: 500
  learning_rate: 0.1
  early_stopping_rounds: 30
  n_jobs: -1

nn:
  backbone: transformer        # 다른 백본(예: MotionBERT)을 추가하면 src/dgc/models/__init__.py 에 등록
  d_model: 128
  n_layers: 4
  n_heads: 4
  ff_dim: 256
  dropout: 0.1
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  max_epochs: 100
  patience: 10                 # 검증 Macro-F1 기준 조기 종료 (selection: best_val 일 때만)
  # 모델 선택 방식
  #   best_val: 검증 Macro-F1이 가장 높은 epoch (기존 방식). 단, 검증셋이 학습과 같은 댄서라
  #             점수가 금방 1.0에 붙어서 '처음 보는 댄서' 성능과는 거의 무관하게 고르게 됨
  #   last:     max_epochs 만큼 고정 학습 후 마지막 모델 사용 (검증셋으로 고르지 않음)
  selection: best_val
  grad_clip: 1.0               # 기울기 크기 제한 (적대 학습 폭주 방지). 0이면 끔
  seeds: [0, 1, 2]
  num_workers: 0
  stats_windows: 3000          # 입력 표준화(mean/std)를 계산할 학습 윈도우 수

aug:
  enabled: false
  mirror: true                 # 좌우 반전 (확률 0.5)
  bone_scale: 0.15             # 뼈 길이 ±15%
  time_scale: 0.10             # 재생 속도 ±10%

adv:
  enabled: false               # 장르 조건부 적대 학습
  weight: 1.0                  # 적대 손실 가중치
  gamma: 10.0                  # λ 스케줄: λ(p) = 2/(1+exp(-γp)) - 1
  hidden: 128
  lr_mult: 10.0               # 판별기 학습률 = nn.lr × lr_mult
  lambda_max: 0.5              # λ 최댓값. 1.0이면 학습 후반에 손실이 폭주하는 현상이 실제 데이터에서 관찰됨

probe:
  max_windows_per_genre: 2000  # 개인 정보량 측정용 선형 분류기 학습 윈도우 수 (장르당)
